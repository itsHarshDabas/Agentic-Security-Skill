name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.24"
          cache: false
      - name: Install scanners (pinned)
        run: |
          python -m venv .venv
          .venv/bin/pip install semgrep==1.182.1 bandit==1.9.4 pip-audit==2.10.1 pytest==9.1.1
          GOBIN=$PWD/.tools/bin go install github.com/zricethezav/gitleaks/v8@v8.30.1
          GOBIN=$PWD/.tools/bin go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0
      - name: Tests (offline)
        run: SECAUDIT_TOOL_PATH=$PWD/.tools/bin:$PWD/.venv/bin .venv/bin/python -m pytest -q
      - name: Tests (with dependency scanners)
        run: SECAUDIT_TEST_NETWORK=1 SECAUDIT_TOOL_PATH=$PWD/.tools/bin:$PWD/.venv/bin .venv/bin/python -m pytest -q
      - name: Benchmark
        run: SECAUDIT_TOOL_PATH=$PWD/.tools/bin:$PWD/.venv/bin .venv/bin/python tests/benchmark.py --network
      - name: Remediation benchmark
        run: SECAUDIT_TOOL_PATH=$PWD/.tools/bin:$PWD/.venv/bin .venv/bin/python tests/benchmark.py --remediation
